<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chopper Gunner</title>
  <link rel="preload" href="fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/share-tech-mono.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* fonts are served with the game (SIL OFL, see fonts/) so players' browsers never contact a third party */
    @font-face { font-family: 'Orbitron'; font-weight: 700 900; font-display: swap; src: url(fonts/orbitron.woff2) format('woff2'); }
    @font-face { font-family: 'Share Tech Mono'; font-weight: 400; font-display: swap; src: url(fonts/share-tech-mono.woff2) format('woff2'); }
    :root { color-scheme: dark; background: #05070a; }
    html, body { height: 100%; margin: 0; background: #05070a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="src/util.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/music.js"></script>
  <script src="src/input.js"></script>
  <script src="src/terrain.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/missions.js"></script>
  <script src="src/progress.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
